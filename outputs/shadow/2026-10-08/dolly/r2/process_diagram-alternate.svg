<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#1F3A5F"/><rect width="1600" height="36" fill="#C9A227"/><text x="60" y="110" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">The AI Agency Blueprint</tspan></text><text x="60" y="200" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">How the customer response system works</tspan></text><rect x="60" y="320" width="340" height="300" rx="14" fill="#C9A227"/><text x="84" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="84" dy="0">1</tspan></text><text x="84" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="84" dy="0">Customer question</tspan><tspan x="84" dy="33">arrives (call, text,</tspan><tspan x="84" dy="33">voicemail)</tspan></text><polygon points="406,470 434,470 420,490" fill="#FFFFFF" transform="rotate(-90 420 480)"/><rect x="440" y="320" width="340" height="300" rx="14" fill="#C9A227"/><text x="464" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="464" dy="0">2</tspan></text><text x="464" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="464" dy="0">Check against approved</tspan><tspan x="464" dy="33">documents</tspan></text><polygon points="786,470 814,470 800,490" fill="#FFFFFF" transform="rotate(-90 800 480)"/><rect x="820" y="320" width="340" height="300" rx="14" fill="#C9A227"/><text x="844" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="844" dy="0">3</tspan></text><text x="844" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="844" dy="0">Answer, or hand to the</tspan><tspan x="844" dy="33">named human operator</tspan></text><polygon points="1166,470 1194,470 1180,490" fill="#FFFFFF" transform="rotate(-90 1180 480)"/><rect x="1200" y="320" width="340" height="300" rx="14" fill="#C9A227"/><text x="1224" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="1224" dy="0">4</tspan></text><text x="1224" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="1224" dy="0">Log the request</tspan></text><text x="60" y="720" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">Answers come only from documents the client approves. Anything else goes to a named human operator.</tspan></text><rect x="0" y="790" width="1600" height="110" fill="#C9A227"/><text x="800" y="848" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1A1A1A" text-anchor="middle"><tspan x="800" dy="0">The AI Agency Blueprint | 80 River St., Hoboken, NJ 07030 | 856-254-6000 | www.theaiagencyblueprint.com</tspan></text></svg>